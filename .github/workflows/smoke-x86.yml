name: Smoke x86_64

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Create venv & install package (minimal, no dev extras)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python .
          .venv/bin/python -c "import tradingagents; print('smoke-x86 install OK')"

      - name: Run smoke script (stubbed)
        env:
          LLM_STUB: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -u scripts/smoke_structured_output.py google
