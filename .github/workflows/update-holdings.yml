name: Update Stock Holdings

on:
  schedule:
    - cron: '0 9 * * *' # Daily at 9:00 AM UTC
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  fetch-holdings:
    # Installs and runs third-party PyPI packages, so this job intentionally
    # keeps the default read-only token — it never touches git write access.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas stockstats python-dotenv requests

      - name: Run holdings update script
        run: |
          python scripts/fetch_holdings.py

      - name: Check whether holdings data changed
        id: diff
        run: |
          if git diff --quiet -- data/holdings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated holdings
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: holdings-json
          path: data/holdings.json
          retention-days: 1

  commit-holdings:
    # Only this job needs push access, and it never installs third-party
    # dependencies or runs untrusted code — it just writes back the artifact
    # the read-only fetch job already produced.
    needs: fetch-holdings
    if: needs.fetch-holdings.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download updated holdings
        uses: actions/download-artifact@v4
        with:
          name: holdings-json
          path: data

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/holdings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update stock holdings prices" && git push)

      - name: Generate workflow summary
        run: |
          echo "### Portfolio Update Summary :chart_with_upwards_trend:" >> $GITHUB_STEP_SUMMARY
          echo "Stock holdings current prices updated successfully on $(date)." >> $GITHUB_STEP_SUMMARY
